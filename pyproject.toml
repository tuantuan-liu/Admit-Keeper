[project]
name = "admit-keeper"
version = "1.0.0"
description = "Platform-agnostic admission gate: framework-agnostic kernel + gate helper, with a Hermes adapter example and an MCP admin server."
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0,<2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["admit_keeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# 显式钉住规则集 —— ruff 未配置时会用「当前版本的默认集」，而它会随版本扩张
# （0.16 起默认纳入 I / UP / RUF100 等，会把本仓库既有的 Optional[X] 写法全判红）。
# 这里恢复经典默认集（pycodestyle 报错类 + Pyflakes），保证 `ruff check` 跨版本可复现。
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "mcp[cli]>=1.0,<2",
    "pytest>=8",
]

[tool.uv]
python-preference = "system"
